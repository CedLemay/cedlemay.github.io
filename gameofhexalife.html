<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game of Life but Hexagon</title>
    <style>
       .topContent {
        display: inline-block;
        margin-bottom: 30px;
        }
       button {
            height: 30px;
            display: inline-block;
            margin-right: 5px;
            font-size: 16px;      /* Set a fixed font size */
            line-height: 1;       /* Prevent extra vertical space */
            padding: 0 10px;      /* Optional: adjust horizontal padding */
        }
        
          
          .controlsSection
        { 
            border: 2px solid #888; 
            border-radius: 10px;            
            
            padding-bottom: 20px;
            padding-left: 20px;

            margin-bottom: 20px;
            background: #ebebeb; 
            max-width: 500px;
          
        }
    </style>
</head>
<body>
    <section class="controlsSection">
        <h2  class="controlsTitle">Contrôles du Jeu</h2>
        <div id="topContent">
            <div style="margin-bottom: 10px;">
                <button id="btnNextGen" onclick="stepToNextGeneration()"> Prochaine géneration </button>
                <button id="btnReset" onclick="reset()"> Réinitialiser </button>
            </div>
            <div>
                <button id="btnStartAutoStep" onclick="startAutoStep(document.getElementById('stepSpeed').value)"> ▶ </button>
                <button id="btnPauseAutoStep" onclick="pauseAutoStep()"> ❚❚ </button>
                <label for="stepSpeed">Vitesse (ms):</label>
                <input type="number" id="stepSpeed" min="200" max="5000" value="500" style="width:70px;" onchange="updateStepSpeed(this.value)">
            </div>
            
        </div>
    </section>


    <canvas id="canvas" width="800" height="500"></canvas>
    <script src="hexalife.js"></script>

</body>
</html>
