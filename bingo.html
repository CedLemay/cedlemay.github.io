<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Buttons Example</title>
    <style>
        .iblock-table {
            display : inline-block;
            vertical-align:top;
        }

        .iblock-form {
            display : inline-block; 
            margin-left: 20px ;
            margin-top: 20px ;
        }

        .bingo-cells {
            border-radius: 10px;
            width: 100px;
            height: 100px;
            border: 1px solid black;
          text-align: center;

            vertical-align:middle;

        }

        table, th {

            border: 1px solid black;
            text-align: center;

        }

        th{
            height: 50px;
        }

        td:hover
        {
          background-color: yellow;
        }
        
        td.selected
        {
          background-color: aqua;
        }
    </style>
</head>
<body>

    <template id="bingo-row-template">
      <tr id="bingoRow">        
      </tr>
    </template>

    <template id="bingo-cell-template">
      <td id="bingoCell" class="bingo-cells">
      </td>
    </template>
    
    <table id="tableContent" class="iblock-table">
        <tr>
          <th colspan ="5" >BINGO</th>          
        </tr>
        
    </table>

    <form id ="noPrint" class="iblock-form">
      <label> Test </label>
      <input type="text" id="cellContentText">

      <button onclick="printBingo()"> Print Bingo</button>
    </form>

    <script>

        const pageContent       = document.getElementById('pageContent');
        const bingorowtemplate  = document.getElementById('bingo-row-template');

        const bingocelltemplate = document.getElementById('bingo-cell-template');
         
        let selectedCell = null;

        document.getElementById('cellContentText').addEventListener("input", function () {
        if (selectedCell) {
          selectedCell.textContent = document.getElementById('cellContentText').value; // Update TD text
        }
    });

        function AddAllBingoCells()
        {
            for(let i = 0; i < 5; i++)
            {
              AddBingoRow(i);              
            }
        }

        function AddBingoRow(_x)
        {          
          const brTemplate = bingorowtemplate.content.cloneNode(true);
          const rowElement = brTemplate.querySelector('#bingoRow');

          rowElement.id = 'bingoRow' + _x;        
          
          for(let j = 0; j < 5; j++)
          { 
              AddBingoCell(_x, j, brTemplate);
          }
          
          tableContent.appendChild(brTemplate);
        }

        function AddBingoCell(_x, _y, rowTemplate)
        {
          const bcTemplate = bingocelltemplate.content.cloneNode(true);
          
          const rowElement = bcTemplate.querySelector('#bingoCell');
          rowElement.id = 'bingoCell' + _x + "_" + _y;  
          rowElement.textContent = _x + " | " + _y
          
          
          rowTemplate.appendChild(bcTemplate);
        }


        function addSelectionEvent()
        {
        // Function to handle the click event on all <td> elements
          document.addEventListener('DOMContentLoaded', () => {
              const tableCells = document.querySelectorAll('td');

              let previouslySelected = null;

              tableCells.forEach(cell => {
                  cell.addEventListener('click', () => {
                      // Remove 'selected' class from the previously selected cell
                      if (previouslySelected) {
                          previouslySelected.classList.remove('selected');
                      }

                      // Add 'selected' class to the clicked cell
                      cell.classList.add('selected');

                      document.getElementById('cellContentText').value = cell.innerHTML ;
                      selectedCell = cell;

                      // Update the reference to the currently selected cell
                      previouslySelected = cell;
                  });
              });
            });
        }
       
        function printBingo() {
            document.getElementById('noPrint').style.display = "none";
            
            window.print();

            document.getElementById('noPrint').style.display = "inline-block";
        }

        AddAllBingoCells();
        addSelectionEvent();

    </script>

</body>
</html>
