<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Buttons Example</title>
    <style>
        form, table {
            display : inline-block;
            vertical-align:top;
        }
        table, th, td {

            border: 1px solid black;
            text-align: center;

        }
        th{
            height: 50px;
        }
        td {
            border-radius: 10px;
            width: 50px;
            height: 50px;
            
        }
        td:hover
        {
          background-color: yellow;
        }
        td.selected
        {
          background-color: aqua;
        }
    </style>
</head>
<body>
    <table>
        <tr>
          <th colspan ="5" >BINGO</th>
          
        </tr>
        <tr>
          <td>b1</td>

        </tr>
        <tr>
            <td>b2</td>

            <td>n2</td>
            <td>g2</td>
            <td>o2</td>
          </tr>
          <tr>
            <td>b3</td>
            <td>i3</td>
            <td>X</td>

          </tr>
          <tr>
            <td>b4</td>

          <tr>

          </tr>
      </table>

      <form>
        <label> Test </label>
      </form>
    
    <script>

        function AddBingoSquare(_x)
        {
            const dTemplate = dicetemplate.content.cloneNode(true);
                
                const btnElement = dTemplate.querySelector('#diceBtn');
                btnElement.id = 'diceBtn' + _x;
                btnElement.value = _x; 
                btnElement.addEventListener('click', showValue, false);
                    
                const imgElement = dTemplate.querySelector('#diceImg');
                imgElement.id = 'diceImg' + _x;
                imgElement.src= 'img/d'+ _x +'.webp';
                imgElement.alt= 'D'+ _x +' Button';

                const qTemplate = qtytemplate.content.cloneNode(true);   
                const containerElement = dTemplate.querySelector('#container');
                containerElement.id = 'container'+_x;
                containerElement.style.display = 'none';
                containerElement.appendChild(qTemplate);
                
                pageContent.appendChild(dTemplate);
        }
      


      function AddClickToBingoSquares()
      {
        // Function to handle the click event on all <td> elements
        document.addEventListener('DOMContentLoaded', () => {
            const tableCells = document.querySelectorAll('td');

            let previouslySelected = null;

            tableCells.forEach(cell => {
                cell.addEventListener('click', () => {
                    // Remove 'selected' class from the previously selected cell
                    if (previouslySelected) {
                        previouslySelected.classList.remove('selected');
                    }

                    // Add 'selected' class to the clicked cell
                    cell.classList.add('selected');

                    // Update the reference to the currently selected cell
                    previouslySelected = cell;
                });
            });
        });
      
      }
      AddClickToBingoSquares();
    </script>

</body>
</html>
